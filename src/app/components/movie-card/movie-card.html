<article
  class="group cursor-pointer"
  (click)="onMovieClick()"
>

  <!-- POSTER -->

  <div
    class="relative aspect-[2/3] overflow-hidden rounded-xl bg-zinc-900"
  >

    <!-- IMAGE -->

    <img
      [src]="movie().poster"
      [alt]="movie().title"
      class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
    />


    <!-- DARK OVERLAY -->

    <div
      class="absolute inset-0 flex items-center justify-center bg-black/50 opacity-0 transition duration-300 group-hover:opacity-100"
    >

      <p-button
  icon="pi pi-play"
  [rounded]="true"
  [raised]="true"
  severity="danger"
  ariaLabel="Watch movie"
  (click)="onWatch(); $event.stopPropagation()"
/>

    </div>


    <!-- RATING -->

    <div
      class="absolute right-2 top-2 flex items-center gap-1 rounded-md bg-black/80 px-2 py-1 text-xs font-semibold text-yellow-400"
    >

      <i class="pi pi-star-fill text-[10px]"></i>

      {{ movie().rating }}

    </div>


    <!-- YEAR -->

    <div
      class="absolute bottom-2 left-2 rounded-md bg-black/80 px-2 py-1 text-xs text-zinc-300"
    >
      {{ movie().year }}
    </div>

  </div>


  <!-- MOVIE INFORMATION -->

  <div class="pt-3">

    <h3
      class="truncate text-sm font-semibold text-white transition group-hover:text-red-400"
    >
      {{ movie().title }}
    </h3>

    <p
      class="mt-1 text-xs text-zinc-500"
    >
      {{ movie().year }}

      <span class="mx-1">
        •
      </span>

      {{ movie().genre }}
    </p>

  </div>

</article>
