<section class="mx-auto max-w-7xl px-5 py-12 lg:px-8">
  <!-- SECTION HEADER -->

  <div class="mb-7 flex items-end justify-between">
    <div>
      <h2 class="text-2xl font-bold tracking-tight text-white">
        {{ title() }}
      </h2>

      @if (subtitle()) {
        <p class="mt-1 text-sm text-zinc-500">
          {{ subtitle() }}
        </p>
      }
    </div>

    <!-- SEE ALL -->

    @if (showSeeAll()) {
      <button
        type="button"
        class="hidden items-center gap-2 text-sm font-medium text-zinc-400 transition hover:text-white sm:flex"
      >
        See All

        <i class="pi pi-arrow-right text-xs"></i>
      </button>
    }
  </div>

  <!-- MOVIES -->

  <div
    class="grid grid-cols-2 gap-x-4 gap-y-8 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6"
  >
    @for (movie of movies(); track movie.id) {
      <app-movie-card [movie]="movie" (movieSelected)="onMovieSelected($event)" />
    }
  </div>
</section>
